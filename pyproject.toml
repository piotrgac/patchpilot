[project]
name = "patchpilot"
version = "0.1.0"
description = "Agentless Linux fleet update orchestration with canary deployments, health checks, and automatic rollback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PatchPilot Contributors" },
]

keywords = [
    "devops", "sre", "linux", "updates", "orchestration",
    "ssh", "canary", "rollback", "automation",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "click>=8.1",
    "asyncssh>=2.14",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "testcontainers>=4.0",
    "httpx>=0.27",
    "freezegun>=1.5",
]
dev = [
    "patchpilot[test]",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
metrics = ["prometheus-client>=0.19"]
postgres = ["asyncpg>=0.29"]

[project.urls]
Homepage = "https://github.com/patchpilot/patchpilot"
Repository = "https://github.com/patchpilot/patchpilot"
Documentation = "https://patchpilot.readthedocs.io"
BugTracker = "https://github.com/patchpilot/patchpilot/issues"

[project.scripts]
patchpilot = "patchpilot.cli.main:cli"

[tool.setuptools.packages.find]
include = ["patchpilot*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests that require Docker containers",
    "slow: Tests that take longer than 30 seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
lint.ignore = ["E501"]
fix = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "ARG002", "ARG001", "B017"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/", "examples/"]
[[tool.mypy.overrides]]
module = ["pytest", "asyncssh", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["patchpilot"]
branch = true

[tool.coverage.report]
fail_under = 15
show_missing = true

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
